name: Windows native Qt acceptance checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-qt:
    name: Windows native Qt interaction
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: piTrainer
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile desktop Python
        run: python -m compileall -q piTrainer tests
      - name: Install isolated desktop test dependencies
        run: python -m pip install "pytest>=8,<9" "pandas>=2.2,<3" "numpy>=1.26,<2" "Pillow>=10,<12" "PySide6>=6.7,<6.9" "matplotlib>=3.8,<4"
      - name: Require native Windows platform plugin
        run: python -c "from PySide6.QtWidgets import QApplication; app=QApplication([]); print(app.platformName()); assert app.platformName() == 'windows'"
      - name: Run selected real Qt interaction regressions without skips
        run: |
          $files = @('tests/test_session_keyboard_r35.py','tests/test_validation_controls_r35.py','tests/test_shared_accessibility_r35.py','tests/test_splitter_restore_r50.py','tests/test_splitter_minimums_r50.py','tests/test_validation_marker_lifecycle_r50.py','tests/test_validation_to_data_r50.py','tests/test_review_context_ux61.py')
          foreach ($file in $files) {
            python -m pytest -q $file --junitxml="$env:RUNNER_TEMP/qt-regression.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "import sys,xml.etree.ElementTree as E; cases=E.parse(sys.argv[1]).findall('.//testcase'); assert cases and not any(c.find('skipped') is not None for c in cases)" "$env:RUNNER_TEMP/qt-regression.xml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Native Qt keyboard accessibility at simulated 125 percent scale
        env:
          QT_SCALE_FACTOR: '1.25'
        run: |
          python -c "from PySide6.QtWidgets import QApplication; a=QApplication([]); s=a.primaryScreen(); print(a.platformName(),s.devicePixelRatio(),s.availableGeometry()); assert a.platformName()=='windows' and s.devicePixelRatio()>=1.25"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_shared_accessibility_r35.py tests/test_theme_vd04_vd07.py -k "test_disclosure_restores_focus_only_when_child_is_hidden or test_log_tab_and_progress_result_keyboard_access or test_accessible_table_keyboard_focus_preserves_selection" --junitxml="$env:RUNNER_TEMP/qt-scale-125.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys,xml.etree.ElementTree as E; cases=E.parse(sys.argv[1]).findall('.//testcase'); assert len(cases)==3 and not any(c.find('skipped') is not None for c in cases)" "$env:RUNNER_TEMP/qt-scale-125.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
