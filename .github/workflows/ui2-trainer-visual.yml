name: UI2 trainer visual evidence

on:
  pull_request:
    paths:
      - 'piTrainer/**'
      - 'tools/check_ui2_trainer.py'
      - '.github/workflows/ui2-trainer-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui2-trainer-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trainer-visual:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: ${{ matrix.os == 'windows-latest' && 'windows' || 'offscreen' }}
      PYTHONDONTWRITEBYTECODE: '1'
      BASELINE_SHA: 4d2f66aed73cc5a3ba59f94e0245afcd4fb41c6b
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt platform dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install existing desktop-test dependency ranges
        run: python -m pip install "pandas>=2.2,<3" "numpy>=1.26,<2" "Pillow>=10,<12" "PySide6>=6.7,<6.9" "matplotlib>=3.8,<4"
      - name: Matched original and candidate native widget captures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:RUNNER_TEMP 'ui2-main'
          $evidence = Join-Path $env:RUNNER_TEMP 'ui2-evidence'
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'Candidate revision mismatch' }
          git worktree add --detach $baseline $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Baseline worktree failed' }
          if ((git -C $baseline rev-parse HEAD).Trim() -ne $env:BASELINE_SHA) { throw 'Baseline revision mismatch' }
          python tools/check_ui2_trainer.py --source (Join-Path $baseline 'piTrainer') --output (Join-Path $evidence 'before') --revision $env:BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Baseline capture failed' }
          python tools/check_ui2_trainer.py --source piTrainer --output (Join-Path $evidence 'after') --revision $env:CANDIDATE_SHA --require-readable-status
          if ($LASTEXITCODE -ne 0) { throw 'Candidate capture failed' }
      - name: Preserve original and candidate evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui2-trainer-${{ matrix.os }}
          path: ${{ runner.temp }}/ui2-evidence
          if-no-files-found: error
