name: Hardware-free regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.component }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: PiSD
            deps: '"Flask>=3,<4" "flask-cors>=4,<5" "waitress>=3,<4" "requests>=2.31,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7" "psutil>=5.9,<8" "pandas>=2.2,<3" "numpy>=1.24,<2" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12"'
            python_tests: 'scripts/test_safety_rearm.py scripts/test_operating_control_source.py scripts/test_ai_frame_timeout.py scripts/test_model_manifest.py scripts/test_recording_recovery.py scripts/test_recording_storage.py scripts/test_recording_storage_integration.py scripts/test_replay_session.py scripts/test_error_export_r47.py scripts/test_preflight_r48.py scripts/test_request_trace_r47.py scripts/test_ai_validation_math.py scripts/test_stop_outcome_f4.py scripts/test_manual_lease_f2.py scripts/test_access_control_f3.py scripts/test_config_recovery_f7.py scripts/test_destructive_ux74.py scripts/test_recent_events_r49.py'
            js_tests: 'scripts/test_operating_readiness.cjs scripts/test_settings_feedback.cjs scripts/test_accessibility_r35.cjs scripts/test_adaptive_stream_r43.cjs scripts/test_preflight_ui_r48.cjs scripts/test_request_trace_ui_r47.cjs scripts/test_responsive_r36.cjs scripts/test_ui_copy_r46.cjs scripts/test_manual_lease_f2.cjs scripts/test_destructive_ux74.cjs scripts/test_ui_style_tokens_r45.cjs scripts/test_theme_vd04_vd07.cjs'
          - component: PiServer
            deps: '"Flask>=3,<4" "numpy>=1.24,<2" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12"'
            python_tests: 'tests/test_preview_resource_profile_p2.py tests/test_preview_yuv_p2.py tests/test_camera_lowres_p2.py tests/test_access_api.py tests/test_api_control.py tests/test_control_service.py tests/test_hardware_ownership.py tests/test_safety_rearm_contract.py tests/test_model_compatibility.py tests/test_model_manifest.py tests/test_recorder_storage.py tests/test_recording_storage.py tests/test_preflight_r48.py tests/test_recent_events_r49.py tests/test_request_trace_r47.py tests/test_config_store.py tests/test_config_recovery_f7.py tests/test_destructive_ux74.py'
            js_tests: 'tests/test_preview_freshness.cjs tests/test_settings_feedback.cjs tests/test_accessibility_r35.cjs tests/test_adaptive_polling_r43.cjs tests/test_recording_feedback_ux75.cjs tests/test_session_refresh_ux75.cjs tests/test_layout_presets_ux60.cjs tests/test_preflight_ui_r48.cjs tests/test_recent_events_ui_r49.cjs tests/test_request_trace_ui_r47.cjs tests/test_responsive_r36.cjs tests/test_ui_copy_r46.cjs tests/test_ui_style_tokens_r45.cjs tests/test_destructive_ux74.cjs tests/test_theme_vd04_vd07.cjs'
          - component: piTrainer
            deps: '"pandas>=2.2,<3" "numpy>=1.26,<2" "Pillow>=10,<12" "PySide6>=6.7,<6.9" "matplotlib>=3.8,<4"'
            python_tests: 'tests/test_validation_streaming_p2.py tests/test_plot_projection_p2.py tests/test_dataset_projection_p2.py tests/test_record_streaming_p2.py tests/test_dataset_integrity.py tests/test_metadata_atomicity.py tests/test_export_manifest.py tests/test_model_manifest.py tests/test_background_tasks_r39.py tests/test_preview_r38.py tests/test_selection_scope.py tests/test_filter_positions_p2.py tests/test_review_context_ux61.py tests/test_train_runs_r40.py tests/test_ui_copy_r46.py tests/test_ui_style_contract_r45.py tests/test_session_keyboard_r35.py tests/test_validation_controls_r35.py tests/test_shared_accessibility_r35.py tests/test_recording_to_export_f10.py tests/test_splitter_restore_r50.py tests/test_splitter_minimums_r50.py tests/test_validation_marker_lifecycle_r50.py tests/test_validation_to_data_r50.py tests/test_theme_vd04_vd07.py'
            js_tests: ''
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries for desktop smoke tests
        if: ${{ matrix.component == 'piTrainer' }}
        run: |
          # Qt dependencies are Ubuntu packages; unrelated third-party feeds
          # must not block this install. Keep normal apt signature verification.
          apt_sources=()
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            apt_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          fi
          sudo apt-get "${apt_sources[@]}" -o Acquire::Retries=3 update
          sudo apt-get "${apt_sources[@]}" -o Acquire::Retries=3 install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Compile component Python and shared browser fixtures
        run: python -m compileall -q . ../tools/check_browser_ui.py ../tools/check_r35_setup.py ../tools/check_r36_responsive.py
      - name: Install test-only dependencies
        run: python -m pip install "pytest>=8,<9" ${{ matrix.deps }}
      - name: Verify actual Qt imports and offscreen platform
        if: ${{ matrix.component == 'piTrainer' }}
        run: python -c 'from PySide6.QtWidgets import QApplication; app=QApplication([]); print("Qt platform:", app.platformName())'
      - name: Run isolated Python regression files
        env:
          TEST_FILES: ${{ matrix.python_tests }}
        run: |
          set -euo pipefail
          failed=0
          for file in $TEST_FILES; do
            echo "::group::$file"
            rm -f "$RUNNER_TEMP/regression.xml"
            if python -m pytest -q "$file" --junitxml="$RUNNER_TEMP/regression.xml"; then
              python -c 'import sys, xml.etree.ElementTree as E; root=E.parse(sys.argv[1]).getroot(); tests=root.findall(".//testcase"); skipped=[t.attrib.get("name") for t in tests if t.find("skipped") is not None]; print("Cases:",len(tests),"Skipped:",skipped); sys.exit(not tests or bool(skipped))' "$RUNNER_TEMP/regression.xml" || failed=1
            else
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Run existing JavaScript regression files
        if: ${{ !cancelled() }}
        env:
          JS_TEST_FILES: ${{ matrix.js_tests }}
        run: |
          set -euo pipefail
          failed=0
          for file in $JS_TEST_FILES; do
            echo "::group::$file"
            node --check "$file" || failed=1
            node "$file" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Run restored PiSD standalone validation commands (simulation)
        if: ${{ matrix.component == 'PiSD' && !cancelled() }}
        run: |
          failed=0
          python scripts/test_ai_mode_page.py --output "$RUNNER_TEMP/ai-mode.json" || failed=1
          python scripts/run_standard_validation.py --output "$RUNNER_TEMP/standard-validation.json" || failed=1
          exit "$failed"

      - name: Native browser fixture geometry and interaction checks
        if: ${{ matrix.component != 'piTrainer' && !cancelled() }}
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python ../tools/check_browser_ui.py "${{ matrix.component }}" --output "$RUNNER_TEMP/ui-baseline" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Consolidated R35 setup interaction checks
        if: ${{ matrix.component != 'piTrainer' && !cancelled() }}
        run: python ../tools/check_r35_setup.py "${{ matrix.component }}" --output "$RUNNER_TEMP/ui-baseline/r35-setup" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Consolidated R36 responsive workspace checks
        if: ${{ matrix.component != 'piTrainer' && !cancelled() }}
        run: python ../tools/check_r36_responsive.py "${{ matrix.component }}" --output "$RUNNER_TEMP/ui-baseline/r36-responsive" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: VD1A dark/light rendering and appearance persistence
        if: ${{ matrix.component != 'piTrainer' && !cancelled() }}
        run: python ../tools/check_vd1a_web.py "${{ matrix.component }}" --output "$RUNNER_TEMP/ui-baseline/vd1a" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve synthetic browser captures for review
        if: ${{ matrix.component != 'piTrainer' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-baseline-${{ matrix.component }}
          path: ${{ runner.temp }}/ui-baseline
          if-no-files-found: error
      - name: Clean declared dependency install and launcher smoke
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-smoke"
          smoke="$RUNNER_TEMP/release-smoke/bin/python"
          "$smoke" -m pip install -r requirements.txt
          "$smoke" -m pip check
          "$smoke" ../tools/dependency_audit.py "${{ matrix.component }}"
          case "${{ matrix.component }}" in
            PiSD)
              "$smoke" PiSD.py --help
              "$smoke" PiSD.py --status-only
              "$smoke" scripts/check_service_imports.py
              ;;
            PiServer)
              "$smoke" -c 'import server; assert server.app is not None; assert server.BIND_HOST == "127.0.0.1"'
              ;;
            piTrainer)
              "$smoke" -c 'import main, tensorflow, matplotlib; from PySide6.QtWidgets import QApplication; app=QApplication([]); assert callable(main.run); print(tensorflow.__version__)'
              # Test-only dependency for actual runtime model-service inference; not a trainer install requirement.
              "$smoke" -m pip install "opencv-python-headless>=4.8,<4.12"
              PIDRIVE_THREAD_REPORT="$RUNNER_TEMP/p2-thread-report/threads.json" TF_NUM_INTEROP_THREADS=1 TF_NUM_INTRAOP_THREADS=1 "$smoke" -m unittest discover -s tests -p test_real_tflite_export_f10.py -v
              TF_NUM_INTEROP_THREADS=1 TF_NUM_INTRAOP_THREADS=1 CUDA_VISIBLE_DEVICES=-1 "$smoke" ../tools/check_vd1k_trained_workflow.py --output "$RUNNER_TEMP/vd1k-trained-workflow" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
              if { [ "${{ github.head_ref }}" = update/performance-2-review-resources ] || { [ "${{ github.head_ref }}" = integration/performance-ui2-main-20261128 ] || [ "${{ github.head_ref }}" = release/v1.0.0-candidate ] || [ "${{ github.head_ref }}" = update/visual-design-1b-controls ] || [ "${{ github.head_ref }}" = qualification/1.0.0-rc06-08 ] || [ "${{ github.head_ref }}" = update/visual-design-vd36 ]; }; }; then
                TF_NUM_INTEROP_THREADS=1 TF_NUM_INTRAOP_THREADS=1 TF_ENABLE_ONEDNN_OPTS=0 CUDA_VISIBLE_DEVICES=-1 "$smoke" ../tools/benchmark_p2_training_epoch.py --rounds 5 --rows 96 --epochs 2 --output "$RUNNER_TEMP/p2-thread-report/training-epoch.json"
              fi
              python -m venv "$RUNNER_TEMP/desktop-smoke"
              desktop="$RUNNER_TEMP/desktop-smoke/bin/python"
              "$desktop" -m pip install -r requirements-desktop.txt
              "$desktop" -m pip check
              "$desktop" ../tools/dependency_audit.py piTrainer --desktop-only
              "$desktop" -c 'import main; from PySide6.QtWidgets import QApplication; app=QApplication([]); assert callable(main.run)'
              ;;
          esac

      - name: Preserve real interpreter thread comparison
        if: ${{ matrix.component == 'piTrainer' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-real-tflite-threads
          path: ${{ runner.temp }}/p2-thread-report
          if-no-files-found: error

      - name: Preserve actual trained-workflow evidence
        if: ${{ matrix.component == 'piTrainer' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vd1k-trained-workflow
          path: ${{ runner.temp }}/vd1k-trained-workflow
          if-no-files-found: error

  manifest-contract:
    name: Trainer-to-runtime manifest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_cross_component_manifests.py -v
      - name: Verify changed-file patch package integrity
        run: python -m unittest discover -s tests -p test_patch_package.py -v
      - name: Verify actual forward candidate packages in baseline worktrees
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git merge-base --is-ancestor ba05d2acfa537acefd031dde3f1b79977f27652d "$CANDIDATE_SHA"; then
            python tools/check_forward_packages.py --target "$CANDIDATE_SHA" --inherited-from ba05d2acfa537acefd031dde3f1b79977f27652d
          else
            python tools/check_forward_packages.py --target "$CANDIDATE_SHA"
          fi

      - name: Run original and extended performance benchmarks against exact trusted revisions
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.head_ref == 'update/performance-1-computation' || (github.head_ref == 'update/performance-2-resources' || (github.head_ref == 'update/performance-2-review-resources' || (github.head_ref == 'integration/performance-ui2-main-20261128' || (github.head_ref == 'release/v1.0.0-candidate' || github.head_ref == 'update/visual-design-1b-controls' || github.head_ref == 'qualification/1.0.0-rc06-08' || github.head_ref == 'update/visual-design-vd36'))))) }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m pip install "numpy>=1.26,<2" "pandas>=2.2,<3" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12"
          python -m unittest discover -s tests -p test_benchmark_tflite_threads.py -v
          mkdir -p "$RUNNER_TEMP/performance-update1"
          git worktree add --detach "$RUNNER_TEMP/perf-original" 31f2226596e3552aacb4ce745ce72f50ca216af1
          python "$RUNNER_TEMP/perf-original/tools/benchmark_performance_update1.py" --base 14c57c990ff0f9bae2003e4e8aa552d17a4227c7 --candidate 31f2226596e3552aacb4ce745ce72f50ca216af1 | tee "$RUNNER_TEMP/performance-update1/original.json"
          python tools/benchmark_performance_update1.py --base 14c57c990ff0f9bae2003e4e8aa552d17a4227c7 --candidate "$CANDIDATE_SHA" --profile-dir "$RUNNER_TEMP/performance-update1/profiles" | tee "$RUNNER_TEMP/performance-update1/extended.json"
          git worktree remove --force "$RUNNER_TEMP/perf-original"
      - name: Preserve performance benchmark evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (github.head_ref == 'update/performance-1-computation' || (github.head_ref == 'update/performance-2-resources' || (github.head_ref == 'update/performance-2-review-resources' || (github.head_ref == 'integration/performance-ui2-main-20261128' || (github.head_ref == 'release/v1.0.0-candidate' || github.head_ref == 'update/visual-design-1b-controls' || github.head_ref == 'qualification/1.0.0-rc06-08' || github.head_ref == 'update/visual-design-vd36'))))) }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-update1
          path: ${{ runner.temp }}/performance-update1
          if-no-files-found: error
