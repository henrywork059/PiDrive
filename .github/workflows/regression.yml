name: Hardware-free regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: ${{ matrix.component }} regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: PiSD
            deps: '"Flask>=3,<4" "flask-cors>=4,<5" "waitress>=3,<4" "requests>=2.31,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7" "psutil>=5.9,<8" "pandas>=2.2,<3" "numpy>=1.24,<2" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12"'
            python_tests: 'scripts/test_safety_rearm.py scripts/test_operating_control_source.py scripts/test_ai_frame_timeout.py scripts/test_model_manifest.py scripts/test_recording_recovery.py scripts/test_recording_storage.py scripts/test_recording_storage_integration.py scripts/test_replay_session.py scripts/test_error_export_r47.py scripts/test_preflight_r48.py scripts/test_request_trace_r47.py scripts/test_ai_validation_math.py scripts/test_stop_outcome_f4.py scripts/test_manual_lease_f2.py'
            js_tests: 'scripts/test_operating_readiness.cjs scripts/test_settings_feedback.cjs scripts/test_accessibility_r35.cjs scripts/test_adaptive_stream_r43.cjs scripts/test_preflight_ui_r48.cjs scripts/test_request_trace_ui_r47.cjs scripts/test_responsive_r36.cjs scripts/test_ui_copy_r46.cjs scripts/test_manual_lease_f2.cjs'
          - component: PiServer
            deps: '"Flask>=3,<4" "numpy>=1.24,<2" "opencv-python-headless>=4.8,<4.12"'
            python_tests: 'tests/test_access_api.py tests/test_api_control.py tests/test_control_service.py tests/test_hardware_ownership.py tests/test_safety_rearm_contract.py tests/test_model_compatibility.py tests/test_model_manifest.py tests/test_recorder_storage.py tests/test_recording_storage.py tests/test_preflight_r48.py tests/test_recent_events_r49.py tests/test_request_trace_r47.py'
            js_tests: 'tests/test_preview_freshness.cjs tests/test_settings_feedback.cjs tests/test_accessibility_r35.cjs tests/test_adaptive_polling_r43.cjs tests/test_preflight_ui_r48.cjs tests/test_recent_events_ui_r49.cjs tests/test_request_trace_ui_r47.cjs tests/test_responsive_r36.cjs tests/test_ui_copy_r46.cjs tests/test_ui_style_tokens_r45.cjs'
          - component: piTrainer
            deps: '"pandas>=2.2,<3" "numpy>=1.26,<2" "Pillow>=10,<12" "PySide6>=6.7,<6.9"'
            python_tests: 'tests/test_dataset_integrity.py tests/test_metadata_atomicity.py tests/test_export_manifest.py tests/test_model_manifest.py tests/test_background_tasks_r39.py tests/test_preview_r38.py tests/test_selection_scope.py tests/test_train_runs_r40.py tests/test_ui_copy_r46.py tests/test_ui_style_contract_r45.py'
            js_tests: ''
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries for desktop smoke tests
        if: ${{ matrix.component == 'piTrainer' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install test-only dependencies
        run: python -m pip install "pytest>=8,<9" ${{ matrix.deps }}
      - name: Verify actual Qt imports and offscreen platform
        if: ${{ matrix.component == 'piTrainer' }}
        run: python -c 'from PySide6.QtWidgets import QApplication; app=QApplication([]); print("Qt platform:", app.platformName())'
      - name: Run isolated Python regression files
        env:
          TEST_FILES: ${{ matrix.python_tests }}
        run: |
          set -euo pipefail
          failed=0
          for file in $TEST_FILES; do
            echo "::group::$file"
            rm -f "$RUNNER_TEMP/regression.xml"
            if python -m pytest -q "$file" --junitxml="$RUNNER_TEMP/regression.xml"; then
              python -c 'import sys, xml.etree.ElementTree as E; root=E.parse(sys.argv[1]).getroot(); tests=root.findall(".//testcase"); skipped=[t.attrib.get("name") for t in tests if t.find("skipped") is not None]; print("Cases:",len(tests),"Skipped:",skipped); sys.exit(not tests or bool(skipped))' "$RUNNER_TEMP/regression.xml" || failed=1
            else
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Run existing JavaScript regression files
        if: ${{ !cancelled() }}
        env:
          JS_TEST_FILES: ${{ matrix.js_tests }}
        run: |
          set -euo pipefail
          failed=0
          for file in $JS_TEST_FILES; do
            echo "::group::$file"
            node "$file" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Run restored PiSD standalone validation commands (simulation)
        if: ${{ matrix.component == 'PiSD' && !cancelled() }}
        run: |
          failed=0
          python scripts/test_ai_mode_page.py --output "$RUNNER_TEMP/ai-mode.json" || failed=1
          python scripts/run_standard_validation.py --output "$RUNNER_TEMP/standard-validation.json" || failed=1
          exit "$failed"

  manifest-contract:
    name: Trainer-to-runtime manifest compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_cross_component_manifests.py -v
