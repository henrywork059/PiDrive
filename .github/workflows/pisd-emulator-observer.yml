name: PiSD emulator browser diagnostics cross-platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r PiSD/requirements.txt "playwright>=1.50,<2"
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - run: python -m compileall -q PiSD/pisd PiSD_Emulator
      - run: python PiSD_Emulator/scripts/test_browser_observer.py
      - if: runner.os == 'Windows'
        run: python PiSD_Emulator/scripts/test_frame_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-browser-observer-${{ matrix.os }}
          path: emulator-browser-observer-evidence/
          if-no-files-found: warn
