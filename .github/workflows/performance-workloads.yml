name: Performance Update 1 camera workload qualification
on:
  pull_request:
    branches: [main, update/performance-1-computation]
    paths: ['piTrainer/piTrainer/services/data/plot_service.py', 'piTrainer/piTrainer/panels/data/data_plot_panel.py', 'piTrainer/piTrainer/services/data/filter_service.py', 'tools/benchmark_camera_workloads.py', '.github/workflows/performance-workloads.yml', 'PiSD/pisd/**', 'PiServer/piserver/**']
permissions:
  contents: read
concurrency:
  group: camera-workloads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-workloads:
    if: ${{ (github.head_ref == 'update/performance-1-computation' || (github.head_ref == 'update/performance-2-resources' || github.head_ref == 'update/performance-2-review-resources')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched hardware-free dependencies
        run: python -m pip install "numpy>=1.26,<2" "pandas>=2.2,<3" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12" "psutil>=5.9,<8" "Flask>=3,<4" "flask-cors>=4,<5" "requests>=2.31,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7"
      - name: Execute five paired camera workload rounds against exact PR source
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/benchmark_camera_workloads.py --base 14c57c990ff0f9bae2003e4e8aa552d17a4227c7 --candidate "$CANDIDATE_SHA" --rounds 5 --duration 1.0 --output "$RUNNER_TEMP/camera-workloads/results.json"
      - name: Preserve matched workload evidence
        uses: actions/upload-artifact@v4
        with:
          name: camera-workloads
          path: ${{ runner.temp }}/camera-workloads
          if-no-files-found: error

  p2-preview-and-loading:
    if: ${{ (github.head_ref == 'update/performance-2-resources' || github.head_ref == 'update/performance-2-review-resources') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matched hardware-free dependencies
        run: python -m pip install "numpy>=1.26,<2" "pandas>=2.2,<3" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12" "psutil>=5.9,<8" "Flask>=3,<4"
      - name: Native stream mock operations and 120-second-per-mode profile and reconnect capture-loop soak
        run: python tools/benchmark_p2_preview.py --seconds 120 --rounds 5 --requests 150 --output "$RUNNER_TEMP/p2-resources/preview.json"
      - name: Matched exact-revision JSONL ingestion
        run: python tools/benchmark_p2_record_loading.py --base 1b02da5b22c35c2b31b04761e17f2d6ee6a44862 --candidate "${{ github.event.pull_request.head.sha }}" --rounds 5 --rows 30000 --output "$RUNNER_TEMP/p2-resources/loading.json"
      - name: Incremental exact-revision column-oriented ingestion comparison
        if: ${{ github.head_ref == 'update/performance-2-review-resources' }}
        run: python tools/benchmark_p2_record_loading.py --base 4d2f66aed73cc5a3ba59f94e0245afcd4fb41c6b --candidate "${{ github.event.pull_request.head.sha }}" --rounds 5 --rows 30000 --output "$RUNNER_TEMP/p2-resources/loading-incremental.json"
      - name: Paired training metadata preparation resource comparison
        run: python tools/benchmark_p2_dataset_projection.py --rows 60000 --rounds 5 --output "$RUNNER_TEMP/p2-resources/dataset-projection.json"
      - name: Paired offline validation image preparation resource comparison
        run: python tools/benchmark_p2_validation.py --rows 384 --rounds 5 --batch 16 --output "$RUNNER_TEMP/p2-resources/validation-preparation.json"
      - name: Preserve resource evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: p2-resources
          path: ${{ runner.temp }}/p2-resources
          if-no-files-found: warn
