name: Strict Performance Update 1 qualification
on:
  pull_request:
    branches: [main, update/performance-1-computation, integration/performance-ui2-main-20261128]
    paths: ['piTrainer/piTrainer/services/data/plot_service.py', 'piTrainer/piTrainer/panels/data/data_plot_panel.py', 'piTrainer/piTrainer/services/data/filter_service.py', 'tools/benchmark_performance_strict.py', 'tools/benchmark_trainer_cache_budget.py', '.github/workflows/performance-strict.yml', 'PiSD/pisd/services/camera_service.py', 'PiServer/piserver/services/camera_service.py', 'piTrainer/piTrainer/services/data/record_loader_service.py', 'piTrainer/piTrainer/panels/data/preview_panel.py', 'piTrainer/piTrainer/panels/data/preview_model.py', 'piTrainer/piTrainer/utils/image_utils.py']
permissions:
  contents: read
concurrency:
  group: strict-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict:
    if: ${{ (github.head_ref == 'update/performance-1-computation' || (github.head_ref == 'update/performance-2-resources' || (github.head_ref == 'update/performance-2-review-resources' || (github.head_ref == 'integration/performance-ui2-main-20261128' || github.head_ref == 'release/v1.0.0-candidate')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        kind: [camera, request, trainer, cache]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Qt system libraries
        if: ${{ matrix.kind == 'trainer' || matrix.kind == 'cache' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install matched fixture dependencies
        run: |
          python -m pip install "numpy>=1.26,<2" "pandas>=2.2,<3" "Pillow>=10,<12" "opencv-python-headless>=4.8,<4.12" "psutil>=5.9,<8" "Flask>=3,<4" "flask-cors>=4,<5" "requests>=2.31,<3" "python-dotenv>=1,<2" "PyYAML>=6,<7"
          if [ "${{ matrix.kind }}" = trainer ] || [ "${{ matrix.kind }}" = cache ]; then
            python -m pip install -r piTrainer/requirements-desktop.txt
          fi
      - name: Run focused long workloads or native Qt review
        if: ${{ matrix.kind != 'cache' }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/benchmark_performance_strict.py --kind "${{ matrix.kind }}" --base 14c57c990ff0f9bae2003e4e8aa552d17a4227c7 --prior 4ee5e3022e0cbd4031d26fd99edf306d147a9441 --candidate "$CANDIDATE_SHA" --rounds 5 --duration 8 --rows 30000 --output "$RUNNER_TEMP/strict-${{ matrix.kind }}/results.json"
      - name: Compare cache budgets in separate native Qt workers
        if: ${{ matrix.kind == 'cache' }}
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          extra=()
          if { [ "${{ github.head_ref }}" = update/performance-2-review-resources ] || { [ "${{ github.head_ref }}" = integration/performance-ui2-main-20261128 ] || [ "${{ github.head_ref }}" = release/v1.0.0-candidate ]; }; }; then
            extra+=(--include-low-budgets)
          fi
          python tools/benchmark_trainer_cache_budget.py --base 14c57c990ff0f9bae2003e4e8aa552d17a4227c7 --revision "$CANDIDATE_SHA" --rounds 5 --rows 30000 --output "$RUNNER_TEMP/strict-cache/results.json" "${extra[@]}"
      - name: Preserve completed evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: strict-${{ matrix.kind }}
          path: ${{ runner.temp }}/strict-${{ matrix.kind }}
          if-no-files-found: warn
