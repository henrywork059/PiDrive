name: PiSD emulator AI and replay scenarios
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r PiSD/requirements.txt "tensorflow-cpu==2.16.1"
      - run: python -m compileall -q PiSD/pisd PiSD_Emulator
      - run: node --check PiSD_Emulator/web/assets/scenarios.js
      - run: python PiSD_Emulator/scripts/test_emulator.py
      - run: python PiSD_Emulator/scripts/test_scenarios.py
