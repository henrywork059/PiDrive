name: PiSD emulator AI and replay scenarios
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_NUM_INTEROP_THREADS: '1'
      TF_NUM_INTRAOP_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r PiSD/requirements.txt "tensorflow-cpu==2.16.1" "pandas>=2.2,<3" "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python -m compileall -q PiSD/pisd PiSD_Emulator
      - run: node --check PiSD_Emulator/web/assets/scenarios.js
      - run: python PiSD_Emulator/scripts/test_emulator.py
      - run: python PiSD_Emulator/scripts/test_scenarios.py
      - run: python PiSD_Emulator/scripts/test_ai_browser_scenarios.py
      - run: python PiSD_Emulator/scripts/test_service_faults.py
      - run: node --check PiSD_Emulator/web/assets/environment.js && node --check PiSD_Emulator/web/assets/diagnostics.js
      - run: python PiSD_Emulator/scripts/test_environment_diagnostics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-ai-scenarios
          path: emulator-scenario-evidence/
          if-no-files-found: warn
